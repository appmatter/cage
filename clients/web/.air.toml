# Live reload for clients/web. Install: go install github.com/air-verse/air@latest
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/agent-relay-web"
  cmd = "go build -o ./tmp/agent-relay-web ."
  delay = 400
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "html"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[misc]
  clean_on_exit = true
