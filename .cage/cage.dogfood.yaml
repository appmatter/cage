# Dogfood profile: readable .cage (ro) for developing Cage itself + secrets.
extends: cage.yaml

fs:
  mount:
    .cage:
      host: .cage
      permission: ro
  deny:
    - path: .cage
      active: false
    - path: .cage/cage.yaml
      active: false
    - path: .cage/cage.*.yaml
      active: false

# Seat name == install name → omit plugin:.
secrets:
  plugins:
    openai-oauth:
      # Optional: path (~/.cage/secrets/openai-oauth/auth.json), login (browser|device_code)
      vars:
        ACCESS_TOKEN: access_token
        ACCOUNT_ID: account_id
    onepassword:
      account: my.1password.com # op --account
      app: true # desktop CLI integration (default if omitted)
      vars:
        ANTHROPIC_API_KEY: op://appmatter/anthropic/api-key

network:
  plugins:
    # Full endpoint replace on merge — keep listen/url from base.
    http-proxy:
      openai:
        listen: 18080
        # ChatGPT/Codex subscription OAuth (not Platform API keys).
        url: https://chatgpt.com/backend-api/codex
        headers:
          Authorization: "Bearer {{ secrets.openai-oauth.ACCESS_TOKEN }}"
          ChatGPT-Account-ID: "{{ secrets.openai-oauth.ACCOUNT_ID }}"
          OpenAI-Beta: "responses=v1"
        # Platform API (base cage.yaml) — keep for reference:
        # url: https://api.openai.com/v1
        # headers:
        #   Authorization: "Bearer {{ env.OPENAI_API_KEY }}"
      anthropic:
        listen: 18081
        url: https://api.anthropic.com
        headers:
          x-api-key: "{{ secrets.onepassword.ANTHROPIC_API_KEY }}"
          anthropic-version: "2023-06-01"
        # Platform-style env inject (base cage.yaml) — keep for reference:
        # headers:
        #   x-api-key: "{{ env.ANTHROPIC_API_KEY }}"
        #   anthropic-version: "2023-06-01"
