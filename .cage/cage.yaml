# Example base. Init may write starter values; missing matching runtime.plugins seat/image fails at load.
# Profiles: cage.<name>.yaml → fs mount/copy keyed on target; deny keyed on string; see way forward.md
version: 1

runtime:
  plugins:
    tart:
      priority: 1
      image: ghcr.io/cirruslabs/ubuntu:latest
      # graphics: true
      on-create:
        - .cage/scripts/on-create.sh
      bake: [.cage/scripts/bake-example.sh] # optional operator extras; pi-agent attaches via before_bake
    pi-agent:
      version: "latest"
      # agent_dir: .cage/plugins/runtime/custom  # optional; default .cage/plugins/runtime/pi-agent
      # packages:
      #   - npm:@acme/pi-tools@1.0.0
    # incus:
    #   priority: 2
    #   image: ubuntu/24.04
    # hyperv:
    #   priority: 3
    #   image: Ubuntu
  workdir: /workspace
  # Injected into the sandbox. Prefer placeholders + proxy rewrite; {{ secrets.* }} in env is allowed but weaker.
  env:
    APP_MODE: dev
    ANTHROPIC_API_KEY: "fake-key-for-agent"
    OPENAI_API_KEY: "fake-key-for-agent"

fs:
  layout:
    mode: flat
  # Whole repo → /workspace; .git remounted ro (history/gh reads, no commit/push).
  mount:
    ".": .
    # .git:
    #   host: .git
    #   permission: ro
    # .tmp: .tmp
  copy: {}
  deny:
    # Host secrets — seed via fs.copy (e.g. .env.example → .env), never mount the real file.
    - .env
    - .ssh
    - credentials
    # Keep cage config off the agent FS (masked under the root mount at start).
    # Dogfood: cage.dogfood.yaml removes these and mounts .cage ro.
    - .cage
    - .cage/cage.yaml
    - .cage/cage.*.yaml
    - "**/*.pem"
    - "**/*.key"
  plugins:
    # mention:
    #   include:
    #     - "**/*"
    #   exclude:
    #     - "**/.git/**"
    #     - "**/.cage"
    #     - "**/.cage/**"
    #     - "**/cage.*.yaml"
    #     - "**/node_modules/**"
    #     - "**/.env"
    #     - "**/.env.*"
    #     - "**/*.pem"
    #     - "**/credentials.json"
    # secrets_scanner:
    #   on_find: warn
    #   # Accept known placeholders / paths so they don't warn.
    #   allow:
    #     - OPENAI_API_KEY
    #     - ANTHROPIC_API_KEY
    #     - path: .env.example

# Secret stores (see docs/configuration/secrets). Refs only — no values in yaml.
secrets:
  plugins: {}

network:
  proxy:
    logging: true # CONNECT JSONL → .cage/run/<id>/proxy.log (cage vm logs -f)
  plugins:
    # Sandbox outbound allowlist. Default-deny when set.
    egress:
      deny_response:
        http: true # plain-HTTP DENY → 403 body agents can read
      allow:
        - host: "*.google.com" # google.com + www.google.com + …
        - host: "*.example.com" # google.com + www.google.com + …
          method: GET
        - host: registry.npmjs.org
          port: 443
        - host: "*.golang.org" # proxy.golang.org, sum.golang.org
          port: 443
        - host: go.dev
          port: 443
        - host: "*.go.dev"
          port: 443
        - host: "*.googleapis.com" # module zip CDN (storage.googleapis.com)
          port: 443
        - host: api.github.com
          port: 443
        - host: github.com
          port: 443
        - host: "*.githubusercontent.com"
          port: 443
        - host: pi.dev
          port: 443
        - host: "*.pi.dev"
          port: 443
        - host: api.openai.com
          port: 443
          method: POST
          path: /v1/chat/completions
        - host: api.openai.com
          port: 443
          method: POST
          path: /v1/responses
        - host: chatgpt.com
          port: 443
          method: POST
          path: /backend-api/codex
        - host: chatgpt.com
          port: 443
          method: POST
          path: /backend-api/codex/*
        - host: api.anthropic.com
          port: 443
          method: POST
          path: /v1/messages
        - host: development-postgres.eu-west-2.amazonaws.com
          port: 5432
    # Host-side protocol proxies. Secrets stay on host.
    # Prefer profile overrides over conditionals in templates.
    # ≥2 terminate plugins → explicit unique priority (operator only).
    http-proxy:
      priority: 1
      openai:
        listen: 18080
        url: https://api.openai.com/v1
        headers:
          Authorization: "Bearer {{ env.OPENAI_API_KEY }}"
      anthropic:
        listen: 18081
        url: https://api.anthropic.com
        headers:
          # Anthropic uses x-api-key (not Authorization). Guest sends fake from models.json; host injects real.
          x-api-key: "{{ env.ANTHROPIC_API_KEY }}"
          anthropic-version: "2023-06-01"
    # postgres-proxy:
    #   priority: 2
    #   development-postgres:
    #     listen: 5432
    #     host: development-postgres.eu-west-2.amazonaws.com
    #     port: 5432
