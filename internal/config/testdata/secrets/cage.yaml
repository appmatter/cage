version: 1

runtime:
  plugins:
    tart:
      priority: 1
      image: ghcr.io/cirruslabs/ubuntu:latest
      graphics: false
  workdir: /workspace
  env:
    OPENAI_API_KEY: fake-key-for-agent

fs:
  layout:
    mode: flat
  mount: {}
  copy: {}
  deny:
    - .git
    - .env
    - .cage
  plugins: {}

secrets:
  plugins:
    onepassword:
      vars:
        OPENAI_API_KEY: op://Engineering/openai/api-key

network:
  plugins:
    egress:
      allow:
        - host: api.openai.com
          ports: [443]
    http-proxy:
      openai:
        url: https://api.openai.com/v1
        headers:
          Authorization: "Bearer {{ secrets.onepassword.OPENAI_API_KEY }}"
