extends: cage.yaml

secrets:
  plugins:
    onepassword:
      account: my.1password.com
    organization-op:
      plugin: onepassword
      account: company.1password.com
      vars:
        ANTHROPIC_API_KEY: op://organization/team/docs-agent/anthropic/api-key

network:
  plugins:
    egress:
      allow:
        - host: api.openai.com
          ports: [443]
        - host: api.anthropic.com
          ports: [443]
    http-proxy:
      openai:
        url: https://api.openai.com/v1
        headers:
          Authorization: "Bearer {{ secrets.onepassword.OPENAI_API_KEY }}"
      anthropic:
        url: https://api.anthropic.com
        headers:
          x-api-key: "{{ secrets.organization-op.ANTHROPIC_API_KEY }}"
