# Second 1Password account as a named seat. Merges onto cage.yaml.
extends: cage.yaml

runtime:
  env:
    ANTHROPIC_API_KEY: fake-key-for-agent

secrets:
  plugins:
    onepassword:
      account: my.1password.com # personal (CLI --account)
    organization-op:
      plugin: onepassword
      account: acme.1password.com
      vars:
        ANTHROPIC_API_KEY: op://team/docs-agent/anthropic/api-key

network:
  plugins:
    egress:
      allow:
        - host: api.openai.com
          port: 443
          method: POST
          path: /v1/chat/completions
        - host: api.anthropic.com
          port: 443
          method: POST
          path: /v1/messages
    http-proxy:
      openai:
        url: https://api.openai.com/v1
        headers:
          Authorization: "Bearer {{ secrets.onepassword.OPENAI_API_KEY }}"
      anthropic:
        url: https://api.anthropic.com/v1
        headers:
          Authorization: "Bearer {{ secrets.organization-op.ANTHROPIC_API_KEY }}"
          anthropic-version: "2023-06-01"
