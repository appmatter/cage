pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{md,yml,yaml,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks git --pre-commit --staged --redact --no-banner
